name: Auto-Update Projects in README

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Using your PAT here fixes the Git authentication (exit code 128)
          token: ${{ secrets.GH_PAT }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Fixed parameter name from image_ee98b0.png warning
          python-version: '3.10' 

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Repos and Update README
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} 
        run: |
          python - << 'EOF'
          import os
          import requests
          import re

          # Make sure to swap these out with your actual target profiles/orgs!
          TARGETS = ["aKmsdfhjb"] 
          headers = {"Authorization": f"token {os.environ['GH_TOKEN']}"} if os.environ.get('GH_TOKEN') else {}

          content = "\n"
          
          for target in TARGETS:
              org_res = requests.get(f"https://api.github.com/orgs/{target}", headers=headers)
              url = f"https://api.github.com/orgs/{target}/repos?per_page=100&sort=updated" if org_res.status_code == 200 else f"https://api.github.com/users/{target}/repos?per_page=100&sort=updated"
              
              res = requests.get(url, headers=headers)
              if res.status_code != 200:
                  continue
              
              repos = res.json()
              valid_repos = [r for r in repos if not r['fork'] and not r['archived'] and r['description']]
              
              if valid_repos:
                  content += f"### 🏢 {target.upper()}\n\n"
                  content += "| 🚀 Repository | 📝 Description | ⚡ Tech Stack | ⭐ Stars |\n"
                  content += "|---|---|---|---|\n"
                  
                  valid_repos = sorted(valid_repos, key=lambda x: x['stargazers_count'], reverse=True)[:5]
                  
                  for repo in valid_repos:
                      name = repo['name']
                      html_url = repo['html_url']
                      desc = repo['description'] or "No description provided."
                      lang = repo['language'] or "Misc"
                      stars = repo['stargazers_count']
                      
                      content += f"| **[{name}]({html_url})** | {desc} | `{lang}` | `★ {stars}` |\n"
                  content += "\n"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"(<!-- START_SECTION:my-projects -->)(.*?)(<!-- END_SECTION:my-projects -->)"
          updated_readme = re.sub(pattern, f"\\1\n{content}\\3", readme, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commits if changes were actually made to prevent infinite loops
          git diff-index --quiet HEAD || git commit -m "chore: automated update of projects section [skip ci]"
          git push origin main
